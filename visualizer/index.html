<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChenDB — Visual Database Explorer</title>
    <meta
      name="description"
      content="Inspect the internals of a database engine: pages, records, and diagnostic events."
    />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          const stored = localStorage.getItem("chendb.theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
